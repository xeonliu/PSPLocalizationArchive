id: GRP_BAISHI
name: "巴士汉化组"
status: inactive
founded: "2004"
description: "隶属于国内老牌游戏门户网站“电玩巴士（TGBUS）”的汉化组，是掌机时代（GBA、NDS、PSP等平台）国内最具影响力的汉化组织之一。早期以极高的产出效率著称，曾汉化了大量经典的掌机大作。2008年9月，巴士汉化组的核心成员与PGCG汉化组合并，成立了后来的中华ACG民间协会汉化组（即ACG汉化组）。此后电玩巴士仍有以“巴士汉化组”或相关子部门名义发布的汉化作品，但随着掌机时代的落幕，现已停止活动。"
